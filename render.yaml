services:
  - type: web
    name: appen-p2p-escrow
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: appen-db
          property: connectionString
      - key: DEMO_MODE
        value: true
      - key: NEXT_PUBLIC_DEMO_MODE
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: S3_ENDPOINT
        value: http://localhost:9000
      - key: S3_ACCESS_KEY
        value: minioadmin
      - key: S3_SECRET_KEY
        value: minioadmin
      - key: S3_BUCKET
        value: appen-proofs
      - key: S3_REGION
        value: us-east-1

databases:
  - name: appen-db
    databaseName: appen
    plan: free
